name: Chalk
options:
  bundleIdPrefix: com.dadiguz
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Chalk:
    type: application
    platform: iOS
    info:
      path: Chalk/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: Chalkboard
    sources:
      - path: Chalk
        excludes: [Info.plist]
      - path: Routine
        type: folder
        buildPhase: resources
      - path: Catalog
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dadiguz.chalk
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chalk
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        DEVELOPMENT_LANGUAGE: es
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  ChalkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ChalkTests]
    dependencies:
      - target: Chalk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dadiguz.chalk.tests
schemes:
  Chalk:
    build:
      targets:
        Chalk: all
        ChalkTests: [test]
    test:
      targets: [ChalkTests]
